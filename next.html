<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cutie</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #5b3a2e;
      --pink: #fb7185;
      --pink-dark: #e11d48;
      --paper: #fffdf9;
      --cat: #222;
      --cat-dark: #111;
      --cat-skin: pink;
      --bee-yellow: #f4c13d;
      --bee-blue: #0d323e;
      --font: "Segoe Script", "Comic Sans MS", cursive;
      --pupil-x: 0px;
      --pupil-y: 0px;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #fff7ed 0%, #ffe4e6 48%, #e0f2fe 100%);
      color: var(--ink);
      font-family: var(--font);
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 30px 20px 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      margin-bottom: 16px;
      color: var(--pink-dark);
      font-size: clamp(24px, 5vw, 40px);
      font-style: italic;
    }

    .image-card {
      position: relative;
      width: 656px;
      height: 392px;
      overflow: hidden;
      border: 8px solid rgba(255, 255, 255, 0.9);
      border-radius: 25px;
      background: #fff1f2;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.14);
    }

    .image-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-notebook {
      width: min(656px, 88vw);
      min-height: 145px;
      margin-top: 14px;
      padding: 24px 25px;
      border-radius: 22px;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(91, 58, 46, 0.07) 0,
          rgba(91, 58, 46, 0.07) 1px,
          transparent 1px,
          transparent 30px
        ),
        var(--paper);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.11);
      text-align: center;
    }

    .fade-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      animation: wordFade 1.1s ease forwards;
      animation-fill-mode: both;
      font-size: clamp(18px, 3vw, 27px);
      line-height: 1.65;
      margin-right: 7px;
    }

    .word-1 { animation-delay: 0.2s; }
    .word-2 { animation-delay: 0.8s; }
    .word-3 { animation-delay: 1.4s; }
    .word-4 { animation-delay: 2s; }
    .word-5 { animation-delay: 2.6s; }
    .word-6 { animation-delay: 3.2s; }
    .word-7 { animation-delay: 3.8s; }
    .word-8 { animation-delay: 4.4s; }
    .word-9 { animation-delay: 5s; }
    .word-10 { animation-delay: 5.6s; }
    .word-11 { animation-delay: 6.2s; }
    .word-12 { animation-delay: 6.8s; }
    .word-13 { animation-delay: 7.4s; }
    .word-14 { animation-delay: 8s; }
    .word-15 { animation-delay: 8.6s; }
    .word-16 { animation-delay: 9.2s; }
    .word-17 { animation-delay: 9.8s; }
    .word-18 { animation-delay: 10.4s; }
    .word-19 { animation-delay: 11s; }
    .word-20 { animation-delay: 11.6s; }
    .word-21 { animation-delay: 12.2s; }

    .cat-area {
      position: fixed;
      left: 20px;
      bottom: 15px;
      width: 185px;
      height: 140px;
      z-index: 10;
    }

    .cat {
      --fur: var(--cat);
      --fur-dark: var(--cat-dark);
      --skin: var(--cat-skin);

      position: absolute;
      left: 0;
      bottom: 0;
      width: 145px;
      aspect-ratio: 1;
      font-size: 0.6vmin;
    }

    .cat *,
    .cat *::before,
    .cat *::after {
      position: absolute;
      box-sizing: border-box;
    }

    .cat-alt {
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .cat .shadow {
      width: 80%;
      height: 5%;
      left: 50%;
      top: 99%;
      transform: translateX(-50%);
      border-radius: 50% / 0 0 100% 100%;
      background: #0002;
    }

    .cat .tail {
      width: 50%;
      height: 50%;
      top: 75%;
      left: 52%;
      border: 7em solid transparent;
      border-top-color: var(--fur-dark);
      border-left-color: var(--fur-dark);
      border-radius: 50%;
      clip-path: polygon(100% 0, 100% 100%, 0 30%, 0 0);
    }

    .cat .tail::before {
      content: "";
      width: 7em;
      aspect-ratio: 1;
      left: 81%;
      top: -9%;
      border-radius: 50%;
      background: var(--fur-dark);
    }

    .cat .body {
      left: 50%;
      bottom: 0;
      width: 35%;
      height: 40%;
      transform: translateX(-50%);
      border-radius: 100% / 200% 200% 20% 20%;
      background:
        radial-gradient(100% 80% at 50% 0, var(--fur-dark) 50%, transparent 0),
        var(--fur);
    }

    .cat .body .leg {
      width: 165%;
      height: 38%;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      border-radius: 8em 8em 100% 100% / 10em 10em 16em 16em;
      background: var(--fur);
      scale: 1 -1;
    }

    .cat .body .paw {
      width: 35%;
      height: 49%;
      top: 48%;
      left: 10%;
      border: 0.75em solid white;
      border-top: 0;
      border-bottom: 1em solid white;
      border-radius: 0 0 5em 5em;
      transform: rotate(-10deg);
      clip-path: polygon(0 20%, 100% 30%, 100% 100%, 0 100%);
    }

    .cat .body .paw + .paw {
      right: 7%;
      left: auto;
      height: 50%;
      transform: rotate(13deg) scaleX(-1);
      clip-path: polygon(0 25%, 100% 15%, 100% 100%, 0 100%);
    }

    .cat .ear {
      width: 40%;
      aspect-ratio: 1;
      border: 4em solid var(--fur);
      border-radius: 5% 90% 10% 80%;
      background: var(--skin);
    }

    .cat .ear + .ear {
      right: 0;
      transform: scaleX(-1);
    }

    .cat .head {
      left: 50%;
      width: 80%;
      aspect-ratio: 1.1;
      transform: translateX(-50%);
      border-radius: 100% / 125% 125% 80% 75%;
      background:
        linear-gradient(#0003, transparent 50%),
        var(--fur);
      animation: catBlink 5.5s infinite ease-in-out;
      transform-origin: center;
    }

    .cat .eye {
      --pos: 25%;
      width: 35%;
      aspect-ratio: 1;
      top: 63%;
      left: var(--pos);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: white;
      overflow: hidden;
    }

    .cat .eye::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 60% 55%, black 35%, transparent 0),
        white;
      transform: translate(var(--pupil-x), var(--pupil-y));
      animation: eyeBlink 5.5s infinite ease-in-out;
      transform-origin: center;
    }

    .cat .eye + .eye {
      left: calc(100% - var(--pos));
      transform: translate(-50%, -50%) scaleX(-1);
    }

    .bee-container {
      position: absolute;
      top: 0;
      right: 0;
      width: 90px;
      height: 90px;
      transform-origin: center;
      animation: beeFlyAround 5s infinite ease-in-out;
      will-change: transform;
    }

    .bee-stage {
      position: absolute;
      inset: 0;
      transform: scale(0.42);
      transform-origin: center;
    }

    .bee-wings {
      position: absolute;
      left: 50%;
      top: 10px;
      width: 5em;
      height: 5em;
      background-color: #ea92b9;
      border-radius: 5em 5em 0 5em;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      animation: wingFlap 0.18s infinite alternate ease-in-out;
      z-index: 2;
    }

    .bee-wings::before {
      position: absolute;
      content: "";
      height: 5em;
      width: 5em;
      background-color: #ea92b9;
      border-radius: 5em 5em 5em 0;
      left: 4.68em;
      top: 0;
    }

    .bee-wings::after {
      position: absolute;
      content: "";
      height: 3.75em;
      width: 3.75em;
      top: 1.12em;
      left: 1.12em;
      border-radius: 50%;
      box-shadow: -0.62em -0.62em #f2c7c9;
    }

    .bee-body {
      position: absolute;
      left: 50%;
      top: 46px;
      width: 12.5em;
      height: 7.5em;
      transform: translateX(-50%);
      border-radius: 5em;
      background: linear-gradient(
        to right,
        var(--bee-yellow) 30%,
        var(--bee-blue) 30% 45%,
        var(--bee-yellow) 45% 55%,
        var(--bee-blue) 55% 70%,
        var(--bee-yellow) 70% 80%,
        var(--bee-blue) 80%
      );
      box-shadow: inset 0 -1.56em rgba(0, 0, 0, 0.15);
      z-index: 3;
    }

    .bee-body::before {
      position: absolute;
      content: "";
      height: 0.87em;
      width: 0.87em;
      background-color: #0d323e;
      border-radius: 50%;
      top: 3.43em;
      left: 1.25em;
    }

    .bee-body::after {
      position: absolute;
      content: "";
      height: 0.31em;
      width: 1.87em;
      background-color: #0d323e;
      border-radius: 0.31em;
      top: 3.43em;
      left: 11.87em;
    }

    .bee-shine {
      position: absolute;
      height: 1.25em;
      width: 7.5em;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 1.25em;
      top: 1.25em;
      left: 3.12em;
    }

    .bee-shine::before {
      position: absolute;
      content: "";
      height: 3.12em;
      width: 0.93em;
      background-color: #0b2b35;
      border-radius: 0.93em;
      transform: rotate(-30deg);
      top: 4.68em;
      left: 1.87em;
      box-shadow: 2.5em 1.25em #0b2b35;
    }

    @keyframes wordFade {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes eyeBlink {
      0%, 94%, 100% {
        transform: translate(var(--pupil-x), var(--pupil-y)) scaleY(1);
      }

      96% {
        transform: translate(var(--pupil-x), var(--pupil-y)) scaleY(0.15);
      }

      98% {
        transform: translate(var(--pupil-x), var(--pupil-y)) scaleY(1);
      }
    }

    @keyframes catBlink {
      0%, 94%, 100% {
        transform: translateX(-50%) scaleY(1);
      }

      96% {
        transform: translateX(-50%) scaleY(0.97);
      }

      98% {
        transform: translateX(-50%) scaleY(1);
      }
    }

    @keyframes wingFlap {
      from {
        transform: translateX(-50%) rotate(0deg) scaleY(1);
      }

      to {
        transform: translateX(-50%) rotate(0deg) scaleY(0.55);
      }
    }

    @keyframes beeFlyAround {
      0% {
        transform: translate(0, 0) scale(0.42) scaleX(1);
      }

      20% {
        transform: translate(-75px, 35px) scale(0.42) scaleX(-1);
      }

      40% {
        transform: translate(-145px, -15px) scale(0.42) scaleX(-1);
      }

      60% {
        transform: translate(-70px, -75px) scale(0.42) scaleX(1);
      }

      80% {
        transform: translate(50px, -38px) scale(0.42) scaleX(1);
      }

      100% {
        transform: translate(0, 0) scale(0.42) scaleX(1);
      }
    }

    @media (max-width: 700px) {
      .image-card {
        width: 90vw;
        height: calc(90vw * 392 / 656);
      }

      .bottom-notebook {
        width: 90vw;
        min-height: 135px;
      }

      .cat-area {
        left: 8px;
        bottom: 12px;
        transform: scale(0.83);
        transform-origin: bottom left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="title">for my isha</h1>

    <div class="image-card">
      <img src="imagelyrics.jpg" alt="Cutie image" />
    </div>

    <section class="bottom-notebook">
      <span class="fade-word word-1">Kayang-kaya</span>
      <span class="fade-word word-2">kitang</span>
      <span class="fade-word word-3">pasayahin,</span>
      <span class="fade-word word-4">ipapangako</span>
      <span class="fade-word word-5">ko</span>
      <span class="fade-word word-6">sa’yo</span>
      <span class="fade-word word-7">ang</span>
      <span class="fade-word word-8">bituin,</span>
      <span class="fade-word word-9">at</span>
      <span class="fade-word word-10">sa</span>
      <span class="fade-word word-11">puso</span>
      <span class="fade-word word-12">kong</span>
      <span class="fade-word word-13">ito,</span>
      <span class="fade-word word-14">‘di</span>
      <span class="fade-word word-15">kita</span>
      <span class="fade-word word-16">iiwan.</span>
      <span class="fade-word word-17">Sa</span>
      <span class="fade-word word-18">hirap</span>
      <span class="fade-word word-19">man</span>
      <span class="fade-word word-20">o</span>
      <span class="fade-word word-21">ginhawa.</span>
    </section>

    <div class="cat-area">
      <article class="cat" role="img" aria-labelledby="cat-alt">
        <div class="cat-alt" id="cat-alt">Cartoon of a black cat drawn in cute kawaii style</div>

        <div class="shadow"></div>
        <div class="tail"></div>

        <div class="body">
          <div class="leg"></div>
          <div class="leg"></div>
          <div class="paw"></div>
          <div class="paw"></div>
        </div>

        <div class="ear"></div>
        <div class="ear"></div>

        <div class="head">
          <div class="whisker"></div>
          <div class="whisker"></div>
          <div class="whisker"></div>
          <div class="whisker"></div>

          <div class="eye"><span class="pupil"></span></div>
          <div class="eye"><span class="pupil"></span></div>

          <div class="nose"></div>
        </div>
      </article>

      <div class="bee-container" id="bee" aria-label="Flying bee">
        <div class="bee-stage">
          <div class="bee-wings"></div>
          <div class="bee-body">
            <div class="bee-shine"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const bee = document.getElementById("bee");
    const root = document.documentElement;

    function updateCatEyes() {
      const beeRect = bee.getBoundingClientRect();
      const head = document.querySelector(".cat .head");
      const headRect = head.getBoundingClientRect();

      const beeX = beeRect.left + beeRect.width / 2;
      const beeY = beeRect.top + beeRect.height / 2;
      const headX = headRect.left + headRect.width / 2;
      const headY = headRect.top + headRect.height / 2;

      let dx = (beeX - headX) / 18;
      let dy = (beeY - headY) / 18;

      dx = Math.max(-10, Math.min(10, dx));
      dy = Math.max(-6, Math.min(6, dy));

      root.style.setProperty("--pupil-x", `${dx}px`);
      root.style.setProperty("--pupil-y", `${dy}px`);

      requestAnimationFrame(updateCatEyes);
    }

    requestAnimationFrame(updateCatEyes);
  </script>
</body>
</html>
