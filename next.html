<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cutie</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #fb7185;
      --pink-dark: #e11d48;
      --ink: #5b3a2e;
      --cream: #fff7ed;
      --lavender: #e9d5ff;
      --black-cat: #222;
      --black-cat-dark: #111;
      --cat-skin: pink;
      --font: "Segoe Script", "Comic Sans MS", cursive;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(
        circle at top,
        #fff7ed 0%,
        #ffe4e6 48%,
        #e0f2fe 100%
      );
      font-family: var(--font);
      color: var(--ink);
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 24px 150px;
    }

    .title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--pink-dark);
      font-size: clamp(24px, 5vw, 40px);
      font-style: italic;
      white-space: nowrap;
    }

    /* 4:3 image card */
    .image-card {
      position: absolute;
      top: 98px;
      left: 50%;
      width: min(720px, 88vw);
      aspect-ratio: 4 / 3;
      transform: translateX(-50%);
      overflow: hidden;
      border: 9px solid rgba(255, 255, 255, 0.88);
      border-radius: 25px;
      background: #fff1f2;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Cat container */
    .cat-area {
      position: fixed;
      left: 50%;
      bottom: 38px;
      width: min(400px, 78vw);
      height: 215px;
      transform: translateX(-50%);
      z-index: 5;
    }

    /* Cat code adapted from the supplied code */
    .cat {
      --fur: var(--black-cat);
      --fur-dark: var(--black-cat-dark);
      --skin: var(--cat-skin);
      position: absolute;
      left: 8px;
      bottom: 0;
      width: min(300px, 72vw);
      aspect-ratio: 1;
      font-size: 0.6vmin;
    }

    .cat *,
    .cat *::before,
    .cat *::after {
      position: absolute;
      box-sizing: border-box;
    }

    .cat-alt {
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .cat .shadow {
      width: 80%;
      height: 5%;
      background: #0002;
      border-radius: 50% / 0 0 100% 100%;
      top: 99%;
      left: 50%;
      transform: translateX(-50%);
    }

    .cat .tail {
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 7em solid transparent;
      border-top-color: var(--fur-dark);
      border-left-color: var(--fur-dark);
      clip-path: polygon(100% 0, 100% 100%, 0 30%, 0 0);
      top: 75%;
      left: 52%;
    }

    .cat .tail::before {
      content: "";
      width: 7em;
      aspect-ratio: 1;
      background: var(--fur-dark);
      border-radius: 50%;
      left: 81%;
      top: -9%;
    }

    .cat .body {
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 35%;
      height: 40%;
      background:
        radial-gradient(100% 80% at 50% 0, var(--fur-dark) 50%, transparent 0),
        var(--fur);
      border-radius: 100% / 200% 200% 20% 20%;
    }

    .cat .body .leg {
      width: 165%;
      height: 38%;
      background: var(--fur);
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 8em 8em 100% 100% / 10em 10em 16em 16em;
      transform-origin: center;
      scale: 1 -1;
    }

    .cat .body .paw {
      width: 35%;
      height: 49%;
      border: 0.75em solid white;
      border-top: 0;
      border-radius: 0 0 5em 5em;
      border-bottom: 1em solid white;
      top: 48%;
      transform: rotate(-10deg);
      left: 10%;
      clip-path: polygon(0 20%, 100% 30%, 100% 100%, 0 100%);
    }

    .cat .body .paw + .paw {
      right: 7%;
      height: 50%;
      left: auto;
      transform: rotate(13deg) scaleX(-1);
      clip-path: polygon(0 25%, 100% 15%, 100% 100%, 0 100%);
    }

    .cat .ear {
      width: 40%;
      aspect-ratio: 1;
      border: 4em solid var(--fur);
      border-radius: 5% 90% 10% 80%;
      background: var(--skin);
    }

    .cat .ear + .ear {
      right: 0;
      transform: scaleX(-1);
    }

    .cat .head {
      width: 80%;
      aspect-ratio: 1.1;
      left: 50%;
      transform: translateX(-50%);
      background:
        linear-gradient(#0003, transparent 50%),
        var(--fur);
      border-radius: 100% / 125% 125% 80% 75%;
    }

    .cat .whisker {
      width: 30%;
      height: 30%;
      border-radius: 50%;
      border: 2em solid transparent;
      border-top-color: var(--fur);
      border-left-color: var(--fur);
      clip-path: polygon(100% 0, 100% 100%, 0 30%, 0 0);
    }

    .cat .whisker:nth-child(1) {
      top: 70%;
      transform: translateX(-65%);
    }

    .cat .whisker:nth-child(2) {
      top: 80%;
      transform: translateX(-40%) rotate(-20deg);
    }

    .cat .whisker:nth-child(3) {
      right: 0;
      top: 70%;
      transform: translateX(65%) rotate(10deg);
    }

    .cat .whisker:nth-child(4) {
      right: 0;
      top: 80%;
      transform: translateX(40%) rotate(24deg);
    }

    .cat .nose {
      width: 10%;
      height: 7%;
      top: 78%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--skin);
    }

    .cat .eye {
      --pos: 25%;
      --x1: 50%;
      --x2: 42%;
      width: 35%;
      aspect-ratio: 1;
      top: 63%;
      left: var(--pos);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(50% 50% at var(--x1) 47%, white 25%, transparent 0),
        radial-gradient(50% 50% at var(--x2) 65%, white 12%, transparent 0),
        radial-gradient(circle at 60% 55%, #000 35%, transparent 0),
        white;
    }

    .cat .eye + .eye {
      --x1: 70%;
      --x2: 78%;
      left: calc(100% - var(--pos));
      transform: translate(-50%, -50%) scaleX(-1);
    }

    /* Flying bee */
    .bee {
      position: absolute;
      top: 8px;
      right: 16px;
      width: 31px;
      height: 22px;
      z-index: 9;
      border-radius: 50%;
      background: repeating-linear-gradient(
        90deg,
        #facc15 0 7px,
        #3f2419 7px 12px
      );
      animation: beeAround 5s ease-in-out infinite;
    }

    .bee::before,
    .bee::after {
      content: "";
      position: absolute;
      top: -10px;
      width: 17px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.84);
    }

    .bee::before {
      left: 0;
      transform: rotate(-25deg);
    }

    .bee::after {
      right: 0;
      transform: rotate(25deg);
    }

    .next-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      border: 0;
      border-radius: 999px;
      padding: 11px 23px;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      font-family: var(--font);
      font-style: italic;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.25);
    }

    .next-btn:active {
      transform: scale(0.94);
    }

    @keyframes beeAround {
      0% {
        transform: translate(0, 0) rotate(5deg);
      }

      20% {
        transform: translate(-85px, 30px) rotate(-8deg);
      }

      40% {
        transform: translate(-155px, -20px) rotate(9deg);
      }

      60% {
        transform: translate(-75px, -74px) rotate(-5deg);
      }

      80% {
        transform: translate(55px, -35px) rotate(8deg);
      }

      100% {
        transform: translate(0, 0) rotate(5deg);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 60px;
      }

      .image-card {
        top: 92px;
        width: 88vw;
      }

      .cat-area {
        bottom: 34px;
        height: 180px;
      }

      .cat {
        width: 245px;
      }

      .next-btn {
        right: 15px;
        bottom: 15px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="title">For you, cutie ♡</h1>

    <!-- Exact storage filename -->
    <div class="image-card">
      <img
        src="imagelyrics.jpg"
        alt="Uploaded image"
      />
    </div>

    <div class="cat-area">
      <article
        class="cat"
        role="img"
        aria-labelledby="cat-alt"
      >
        <div class="cat-alt" id="cat-alt">
          Cartoon of a black cat drawn in cute kawaii style
        </div>

        <div class="shadow"></div>
        <div class="tail"></div>

        <div class="body">
          <div class="leg"></div>
          <div class="leg"></div>
          <div class="paw"></div>
          <div class="paw"></div>
        </div>

        <div class="ear"></div>
        <div class="ear"></div>

        <div class="head">
          <div class="whisker"></div>
          <div class="whisker"></div>
          <div class="whisker"></div>
          <div class="whisker"></div>
          <div class="eye"></div>
          <div class="eye"></div>
          <div class="nose"></div>
        </div>
      </article>

      <div class="bee" aria-label="Flying bee"></div>
    </div>

    <!-- Present immediately on this second page -->
    <button class="next-btn" id="nextBtn">
      Next →
    </button>
  </main>

  <script>
    document.getElementById("nextBtn").addEventListener("click", () => {
      /*
        Change this to the real third-page filename
        when you create the next page.
      */
      window.location.href = "third.html";
    });
  </script>
</body>
</html>
