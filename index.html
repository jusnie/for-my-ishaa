<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #fff7ed;
      --bg2: #ffe4e6;
      --bg3: #e0f2fe;
      --paper: #fffdf9;
      --ink: #5b3a2e;
      --pink: #fb7185;
      --pink-light: #fecdd3;
      --green-dark: #166534;
      --green: #16a34a;
      --green-light: #4ade80;
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.14);
      --message-font: "Segoe Script", "Comic Sans MS", cursive;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(
        circle at top,
        var(--bg1) 0%,
        var(--bg2) 42%,
        var(--bg3) 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--message-font);
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0;
    }

    /* ----------------------------
       CUTE ROUND MUSIC BUTTON
    ----------------------------- */
    .audio-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ffffff, #ffe4ec);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.12),
        inset 0 2px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.2s ease;
    }

    .audio-btn:active {
      transform: scale(0.92);
    }

    .audio-btn svg {
      width: 33px;
      height: 33px;
      overflow: visible;
    }

    .speaker-main {
      fill: var(--pink);
      transition: transform 0.25s ease;
      transform-origin: center;
    }

    .sound-line {
      stroke: var(--pink);
      stroke-width: 1.8;
      stroke-linecap: round;
      opacity: 0;
      transform: scaleX(0.25);
      transform-origin: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .mute-cross {
      stroke: var(--pink);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 1;
      transform: scale(1);
      transform-origin: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .audio-btn.playing .sound-line {
      opacity: 1;
      transform: scaleX(1);
    }

    .audio-btn.playing .mute-cross {
      opacity: 0;
      transform: scale(0.65) rotate(-12deg);
    }

    .audio-btn.playing .speaker-main {
      transform: translateX(-1px) scale(1.03);
    }

    /* ----------------------------
       LOADING FLOWER
    ----------------------------- */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      transition: opacity 0.7s ease, transform 0.7s ease;
      pointer-events: none;
    }

    .loader.hide {
      opacity: 0;
      transform: scale(0.96);
    }

    .loading-flower {
      position: relative;
      width: 112px;
      height: 155px;
      animation: loaderFloat 2.8s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.1));
    }

    .loading-head {
      position: absolute;
      top: 0;
      left: 50%;
      width: 84px;
      height: 84px;
      transform: translateX(-50%);
    }

    .loading-petal {
      position: absolute;
      bottom: 0;
      width: 38px;
      height: 74px;
      border-radius: 40px 40px 16px 16px;
      background: linear-gradient(180deg, #ffc1cf, var(--pink));
    }

    .loading-petal.center {
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .loading-petal.left {
      left: 5px;
      transform: rotate(-24deg);
    }

    .loading-petal.right {
      right: 5px;
      transform: rotate(24deg);
    }

    .loading-stem {
      position: absolute;
      top: 74px;
      left: 50%;
      width: 12px;
      height: 82px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(#4ade80, #15803d);
    }

    .loading-leaf {
      position: absolute;
      top: 110px;
      width: 46px;
      height: 25px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(#86efac, #22c55e);
    }

    .loading-leaf.left {
      left: 2px;
      transform: rotate(-30deg);
    }

    .loading-leaf.right {
      right: 2px;
      transform: scaleX(-1) rotate(-30deg);
    }

    .loading-text {
      font-family: var(--message-font);
      font-size: 19px;
      font-style: italic;
      color: var(--ink);
      letter-spacing: 1px;
    }

    .loading-text::after {
      content: "";
      animation: loadingDots 1.2s steps(4, end) infinite;
    }

    /* ----------------------------
       NOTEBOOK + BOTTOM GARDEN
    ----------------------------- */
    .paper-wrap {
      position: relative;
      width: min(900px, 92vw);
      padding-bottom: 92px;
      perspective: 1400px;
      visibility: hidden;
      opacity: 0;
    }

    .paper-wrap.show {
      visibility: visible;
      opacity: 1;
    }

    .paper {
      position: relative;
      z-index: 2;
      min-height: 540px;
      overflow: visible;
      border-radius: 28px;
      padding: 34px 34px 34px 56px;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(91, 58, 46, 0.06) 0,
          rgba(91, 58, 46, 0.06) 1px,
          transparent 1px,
          transparent 32px
        ),
        var(--paper);
      box-shadow: var(--shadow);
      transform-origin: top center;
      transform: rotateX(-88deg) scaleY(0.12);
      opacity: 0;
    }

    .paper.unfold {
      animation: unfold 1.15s ease forwards;
    }

    .date,
    .left-info,
    .typed,
    .name-tag {
      font-family: var(--message-font);
      font-style: italic;
      color: var(--ink);
    }

    .date {
      position: absolute;
      top: 26px;
      right: 32px;
      font-size: 18px;
      font-weight: 700;
    }

    .left-info {
      position: absolute;
      top: 24px;
      left: 48px;
      font-size: 20px;
      line-height: 1.75;
      font-weight: 700;
    }

    .message-box {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 125px 46px 55px;
    }

    .typed {
      max-width: 710px;
      text-align: center;
      font-size: clamp(20px, 3.1vw, 32px);
      font-weight: 700;
      line-height: 1.65;
      transform: skewX(-7deg);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 4px;
      vertical-align: -2px;
      background: var(--pink);
      animation: blink 0.8s step-end infinite;
    }

    /* Static bottom name */
    .name-tag {
      position: absolute;
      left: 50%;
      bottom: -32px;
      z-index: 7;
      transform: translateX(-50%);
      font-size: 18px;
      opacity: 0.5;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ----------------------------
       BOTTOM GRASS
    ----------------------------- */
    .bottom-garden {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      pointer-events: none;
    }

    .bottom-grass {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      padding: 0 8px;
    }

    .bottom-blade {
      flex: 0 0 auto;
      width: 5px;
      margin: 0 1px;
      border-radius: 100% 100% 0 0;
      background: linear-gradient(
        to top,
        var(--green-dark),
        var(--green) 66%,
        var(--green-light)
      );
      transform-origin: bottom center;
      animation: grassWave 4.2s ease-in-out infinite;
    }

    /* ----------------------------
       LEFT SUNFLOWER
    ----------------------------- */
    .bottom-sunflower {
      position: absolute;
      left: 23px;
      bottom: 25px;
      width: 62px;
      height: 91px;
      transform-origin: bottom center;
      animation: sunflowerWave 4.8s ease-in-out infinite;
      filter: drop-shadow(0 7px 8px rgba(0, 0, 0, 0.11));
    }

    .sunflower-petals {
      position: absolute;
      top: 0;
      left: 50%;
      width: 56px;
      height: 56px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: conic-gradient(
        #facc15 0deg 15deg,
        #fb923c 15deg 30deg,
        #facc15 30deg 45deg,
        #fb923c 45deg 60deg,
        #facc15 60deg 75deg,
        #fb923c 75deg 90deg,
        #facc15 90deg 105deg,
        #fb923c 105deg 120deg,
        #facc15 120deg 135deg,
        #fb923c 135deg 150deg,
        #facc15 150deg 165deg,
        #fb923c 165deg 180deg,
        #facc15 180deg 195deg,
        #fb923c 195deg 210deg,
        #facc15 210deg 225deg,
        #fb923c 225deg 240deg,
        #facc15 240deg 255deg,
        #fb923c 255deg 270deg,
        #facc15 270deg 285deg,
        #fb923c 285deg 300deg,
        #facc15 300deg 315deg,
        #fb923c 315deg 330deg,
        #facc15 330deg 345deg,
        #fb923c 345deg 360deg
      );
    }

    .sunflower-center {
      position: absolute;
      top: 16px;
      left: 50%;
      z-index: 2;
      width: 25px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #a16207, #451a03);
    }

    .sunflower-stem {
      position: absolute;
      top: 50px;
      left: 50%;
      width: 7px;
      height: 43px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(to bottom, #4ade80, #166534);
    }

    .sunflower-leaf {
      position: absolute;
      top: 67px;
      width: 22px;
      height: 13px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(to bottom, #86efac, #16a34a);
    }

    .leaf-left {
      left: 5px;
      transform: rotate(-30deg);
    }

    .leaf-right {
      right: 5px;
      transform: scaleX(-1) rotate(-30deg);
    }

    @keyframes loaderFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes loadingDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }

    @keyframes unfold {
      0% {
        transform: rotateX(-88deg) scaleY(0.12);
        opacity: 0;
      }

      55% {
        opacity: 1;
      }

      100% {
        transform: rotateX(0) scaleY(1);
        opacity: 1;
      }
    }

    @keyframes grassWave {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes sunflowerWave {
      0%, 100% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(4deg);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      .paper-wrap {
        width: 92vw;
        padding-bottom: 86px;
      }

      .paper {
        min-height: 465px;
        border-radius: 24px;
        padding: 25px 20px 25px 38px;
      }

      .date {
        top: 24px;
        right: 20px;
        font-size: 13px;
      }

      .left-info {
        top: 23px;
        left: 38px;
        font-size: 14px;
      }

      .message-box {
        padding: 100px 30px 44px;
      }

      .typed {
        font-size: 17px;
      }

      .bottom-sunflower {
        left: 13px;
        transform: scale(0.86);
        transform-origin: bottom left;
      }

      .name-tag {
        bottom: -29px;
        font-size: 16px;
      }

      .audio-btn {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

<body>
  <button class="audio-btn playing" id="audioBtn" aria-label="Mute music">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        class="speaker-main"
        d="M5 10v4h4l5 4V6l-5 4H5Z"
      />
      <path
        class="sound-line"
        d="M16 9.5C17.5 10.5 18.1 11.4 18.1 12C18.1 12.6 17.5 13.5 16 14.5"
      />
      <path
        class="sound-line"
        d="M18.4 7.4C20.4 8.9 21.3 10.4 21.3 12C21.3 13.6 20.4 15.1 18.4 16.6"
      />
      <path
        class="mute-cross"
        d="M15.2 8.8L21 14.6M21 8.8L15.2 14.6"
      />
    </svg>
  </button>

  <!-- Put website.mp3 in the same folder as this HTML file -->
  <audio id="bgAudio" autoplay loop preload="auto" playsinline>
    <source src="website.mp3" type="audio/mpeg" />
  </audio>

  <main class="scene">
    <div class="loader" id="loader">
      <div class="loading-flower">
        <div class="loading-head">
          <div class="loading-petal left"></div>
          <div class="loading-petal center"></div>
          <div class="loading-petal right"></div>
        </div>

        <div class="loading-stem"></div>
        <div class="loading-leaf left"></div>
        <div class="loading-leaf right"></div>
      </div>

      <p class="loading-text">Loading</p>
    </div>

    <section class="paper-wrap" id="paperWrap">
      <article class="paper" id="paper">
        <div class="date" id="dateText"></div>

        <div class="left-info">
          <div>To: Name</div>
          <div>From: Your Name</div>
        </div>

        <div class="message-box">
          <div class="typed" id="typedMessage">
            <span class="cursor"></span>
          </div>
        </div>

        <div class="name-tag">juanie</div>
      </article>

      <div class="bottom-garden">
        <div class="bottom-grass" id="bottomGrass"></div>

        <div class="bottom-sunflower">
          <div class="sunflower-petals"></div>
          <div class="sunflower-center"></div>
          <div class="sunflower-stem"></div>
          <div class="sunflower-leaf leaf-left"></div>
          <div class="sunflower-leaf leaf-right"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const audio = document.getElementById("bgAudio");
    const audioBtn = document.getElementById("audioBtn");
    const grass = document.getElementById("bottomGrass");
    const loader = document.getElementById("loader");
    const paperWrap = document.getElementById("paperWrap");
    const paper = document.getElementById("paper");
    const dateText = document.getElementById("dateText");
    const typedMessage = document.getElementById("typedMessage");

    dateText.textContent = new Date().toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    for (let i = 0; i < 90; i++) {
      const blade = document.createElement("div");

      blade.className = "bottom-blade";
      blade.style.height = `${15 + (i % 6) * 3}px`;
      blade.style.animationDelay = `${(i % 12) * 0.09}s`;

      grass.appendChild(blade);
    }

    function updateAudioButton() {
      const isMuted = audio.muted || audio.volume === 0;
      audioBtn.classList.toggle("playing", !isMuted);
      audioBtn.setAttribute(
        "aria-label",
        isMuted ? "Unmute music" : "Mute music"
      );
    }

    async function startMusic() {
      audio.muted = false;
      audio.volume = 1;

      try {
        await audio.play();
        updateAudioButton();
      } catch (error) {
        updateAudioButton();
      }
    }

    audioBtn.addEventListener("click", async () => {
      if (audio.muted) {
        audio.muted = false;
        audio.volume = 1;

        try {
          await audio.play();
        } catch (error) {}
      } else {
        audio.muted = true;
      }

      updateAudioButton();
    });

    audio.addEventListener("play", updateAudioButton);
    audio.addEventListener("volumechange", updateAudioButton);

    document.addEventListener("DOMContentLoaded", startMusic);
    window.addEventListener("load", startMusic);

    const message = "Hi cutie, this little paper is unfolding just for you.";

    function typeMessage() {
      const cursor = typedMessage.querySelector(".cursor");
      let index = 0;

      function typeNextLetter() {
        if (index < message.length) {
          typedMessage.insertBefore(
            document.createTextNode(message.charAt(index)),
            cursor
          );

          index += 1;
          setTimeout(typeNextLetter, 45);
        }
      }

      typeNextLetter();
    }

    setTimeout(() => {
      loader.classList.add("hide");

      setTimeout(() => {
        paperWrap.classList.add("show");
        paper.classList.add("unfold");

        setTimeout(typeMessage, 1100);
      }, 650);
    }, 2800);
  </script>
</body>
</html>
